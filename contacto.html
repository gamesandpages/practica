<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="menu">
        <button class="boton-menu" aria-label="Abrir menú">☰</button>
        <div class="menu-enlaces">
            <a href="index.html">Inicio</a>
            <a href="servicios.html">Servicios</a>
            <a href="productos.html">Productos</a>
            <a href="contacto.html" class="activo" aria-current="page">Contacto</a>
        </div>
    </div>
    <div class="contenido">
        <h1>Contacto</h1>
        <form class="formulario">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Tu nombre" required>

            <label for="correo">Correo</label>
            <input type="email" id="correo" placeholder="tucorreo@ejemplo.com" required>

            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" placeholder="Escribe tu mensaje" required></textarea>

            <button type="submit">Enviar</button>
        </form>
        <div class="gracias" hidden>
            <h2>¡Gracias, <span id="gracias-nombre"></span>!</h2>
            <p>Recibimos tu mensaje.</p>
            <p class="nota">(Este es un sitio de práctica: el mensaje no se envía a ningún lado.)</p>
        </div>
    </div>
    <div class="pie">
        <p>© 2026 Mi primera página</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
